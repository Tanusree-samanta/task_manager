
name: DevOpsForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devopsforge
          POSTGRES_PASSWORD: devopsforge_local_password
          POSTGRES_DB: devopsforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devopsforge -d devopsforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://devopsforge:devopsforge_local_password@localhost:5432/devopsforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devopsforge-backend:ci .

  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true'    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: "555431941301"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy through Systems Manager
        shell: bash
        run: |
          set -euo pipefail

          INSTANCE_ID="i-0ef738ee367cda3da"

          COMMAND_ID="$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --comment "DevOpsForge deployment ${GITHUB_SHA}" \
            --parameters '{"commands":["sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/task_manager && git pull --ff-only origin main && sudo docker compose up --build -d && sudo docker compose ps\""]}' \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command ID: $COMMAND_ID"

          STATUS="Pending"

          for attempt in $(seq 1 36); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" \
                  --output text || true
                exit 1
                ;;
            esac

            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment did not finish successfully within the timeout."
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text || true
            exit 1
          fi

          echo "Deployment completed successfully."

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text
