
name: DevOpsForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devopsforge
          POSTGRES_PASSWORD: devopsforge_local_password
          POSTGRES_DB: devopsforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devopsforge -d devopsforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg2://devopsforge:devopsforge_local_password@localhost:5432/devopsforge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devopsforge-backend:ci .
